/* ---------- retreat group ---------- */
.fab.people { position: relative; }
.badge {
  position: absolute; top: -3px; right: -3px; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px;
  background: var(--brass); color: var(--ink); font: 600 12px/20px var(--font-ui); font-variant-numeric: tabular-nums;
  box-shadow: 0 0 0 2px var(--paper); text-align: center;
}
.mate-wrap { background: none; border: 0; }
.mate {
  position: absolute; left: 50%; top: 50%; width: 32px; height: 32px; margin: -16px 0 0 -16px; border-radius: 50%;
  display: grid; place-items: center; color: #fff; font: 600 13px/1 var(--font-ui); letter-spacing: .02em;
  box-shadow: 0 0 0 2.5px #fff, 0 3px 8px rgba(0,0,0,.35); transition: opacity .3s, filter .3s;
}
.mate-name {
  position: absolute; left: 50%; top: calc(50% + 20px); transform: translateX(-50%); white-space: nowrap;
  padding: 2px 7px; border-radius: 7px; background: rgba(252,251,248,.94); color: var(--ink);
  font: 600 12px/1.3 var(--font-ui); box-shadow: 0 1px 3px rgba(0,0,0,.2); pointer-events: none;
}
.mate-wrap.stale .mate { opacity: .55; filter: grayscale(.8); }
.mate-wrap.stale .mate-name { opacity: .75; }
.mates-small .mate-name { display: none; }
.mate-wrap.sel .mate { box-shadow: 0 0 0 2.5px var(--brass), 0 0 0 5px #fff, 0 4px 12px rgba(0,0,0,.35); }
.mate-wrap.sel .mate-name { display: block; }

.g-sub { margin: 6px 0 0; font-size: 14.5px; color: var(--ink-2); line-height: 1.4; }
.g-me { margin-top: 16px; padding: 16px; border-radius: 16px; background: #F4F1E9; display: flex; flex-direction: column; gap: 12px; }
.g-me label { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.g-field { display: flex; flex-direction: column; gap: 6px; }
.g-me input[type="text"] {
  width: 100%; height: 50px; border-radius: 12px; border: 1px solid var(--rule); background: #fff; padding: 0 14px;
  font: 500 17px var(--font-ui); color: var(--ink);
}
.g-me input[type="text"]:focus { outline: none; border-color: var(--brass); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px; border-radius: 12px; background: #E9E5DA; }
.seg button { height: 40px; border: 0; border-radius: 9px; background: transparent; font: 600 15px var(--font-ui); cursor: pointer; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.g-fine { margin: 0; font-size: 13px; color: var(--ink-3); line-height: 1.45; }
.g-live { display: flex; align-items: center; gap: 12px; }
.g-live .pulse { width: 12px; height: 12px; border-radius: 50%; background: #2E8B57; box-shadow: 0 0 0 4px rgba(46,139,87,.18); flex: none; }
.g-live .txt { flex: 1; min-width: 0; font-size: 15.5px; line-height: 1.35; }
.g-live .txt b { font-weight: 600; }
.g-live .txt span { display: block; color: var(--ink-3); font-size: 13.5px; }
.btn.stop { background: #fff; color: #9A2E22; border: 1.5px solid #E2C6C0; flex: 0 0 auto; min-height: 44px; padding: 0 16px; font-size: 15px; }
.g-err { margin: 0; font-size: 14px; color: #9A2E22; line-height: 1.4; }
.g-head2 { display: flex; align-items: baseline; justify-content: space-between; margin: 20px 0 4px; }
.g-head2 h3 { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.g-head2 button { border: 0; background: none; color: var(--ink); font: 600 14.5px var(--font-ui); cursor: pointer; padding: 6px 0; text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--brass); }
.mates { list-style: none; margin: 0; padding: 0; }

      outer: for (let i = 0; i < groups.length; i++) for (let j = i + 1; j < groups.length; j++) {
        const a = groups[i], b = groups[j];
        if (a.length + b.length < 3 || [...a, ...b].some((x) => x.m.id === sel)) continue;
        if (cen(a).distanceTo(cen(b)) < 46) { groups[i] = a.concat(b); groups.splice(j, 1); merged = true; break outer; }
      }
    }
    const labels = [];
    for (const g of groups) {
      if (g.length === 1) {
        const el = g[0].m.marker.getElement(); el.style.display = "";
        const p = g[0].pt, clash = labels.some((q) => Math.abs(q.x - p.x) < 74 && Math.abs(q.y - p.y) < 22);
        el.classList.toggle("nolabel", clash && g[0].m.id !== sel);
        if (!clash) labels.push(p);
        continue;
      }
      for (const x of g) x.m.marker.getElement().style.display = "none";
      const cx = g.reduce((s, x) => s + x.pt.x, 0) / g.length, cy = g.reduce((s, x) => s + x.pt.y, 0) / g.length;
      const ids = g.map((x) => x.m.id);
      const avs = g.slice(0, 2).map((x) => `<span class="mate mini" style="background:${colorOf(x.m.id)}">${esc(initials(x.m.name))}</span>`).join("");
      const sm = L.marker(map.layerPointToLatLng([cx, cy]), { icon: L.divIcon({ className: "mate-wrap", html: `<span class="stack">${avs}<b>${g.length}</b></span>`, iconSize: [70, 44] }), zIndexOffset: 850, keyboard: true, title: "" });
      sm.on("click", () => {
        const b = L.latLngBounds(g.map((x) => x.m.marker.getLatLng()));
        if (map.getZoom() >= map.getMaxZoom() - 0.2) { filter = ""; openPeople(ids); }
        else centreOn(b.getCenter(), Math.min(map.getMaxZoom(), Math.max(map.getZoom() + 1.2, map.getBoundsZoom(b.pad(2)))));
      });
      sm.addTo(stackLayer);
      sm.getElement().setAttribute("aria-label", `${g.length} people here: ${g.map((x) => x.m.name).join(", ")}`);
    }
  }
  map.on("zoomend", () => { map.getContainer().classList.toggle("mates-small", map.getZoom() < -0.9); declutter(); });
  map.getContainer().classList.toggle("mates-small", map.getZoom() < -0.9);

  /* batched UI refresh so a busy group doesn't rebuild the sheet under someone's finger */
  let refreshTimer = null, lastRefresh = 0;
  function scheduleRefresh() {
    if (refreshTimer) return;
    const wait = Math.max(0, 2500 - (Date.now() - lastRefresh));
    refreshTimer = setTimeout(() => { refreshTimer = null; lastRefresh = Date.now(); refresh(); }, wait);
  }
  const counts = () => { let now = 0, earlier = 0; for (const m of mates.values()) isStale(m) ? earlier++ : now++; return { now, earlier }; };
  function refresh() {
    const { now, earlier } = counts();
    const b = $("#peopleBadge"); b.textContent = now; b.hidden = now === 0;
    $("#btnPeople").setAttribute("aria-label", `People on the map, ${now} here now`);
    declutter();
    if ($("#gCount")) $("#gCount").textContent = countText();
    if ($("#gList")) renderRows();
    if ($("#mateCard")) patchMate();
    if ($("#gMe") && sharing) patchMe();
  }
  const countText = () => { const { now, earlier } = counts(); return `${now} here now` + (earlier ? ` · ${earlier} earlier` : ""); };
  function sharingUI() {
    $("#btnPeople").classList.toggle("sharing", sharing);
    if (sharing) { chip.hidden = false; chip.dataset.kind = "share"; chip.innerHTML = `<span class="live-dot"></span>Sharing until ${clock(me.until)}`; }
    else if (chip.dataset.kind === "share") { chip.hidden = true; chip.dataset.kind = ""; }
  }
  function relayUI() {
    const el = $("#gRelay"); if (!el) return;
    const on = online();
    el.className = "relay" + (on ? " on" : "");
    el.innerHTML = `<i></i>${on ? "Live" : mqttLoaded ? "Reconnecting…" : "Connecting…"}`;
  }

  /* ---- sheet views ---- */
  function showCard(html, state = "place") {
    if (selected && markers.get(selected)) markers.get(selected).getElement().classList.remove("sel");
    selected = null; recluster();
    $("#place").innerHTML = `<div class="p-inner" id="pInner">${html}</div>`;
    $("#viewList").hidden = true; $("#viewPlace").hidden = false; sheet.classList.add("is-place");
    $("#place").querySelectorAll("[data-close]").forEach((b) => b.addEventListener("click", closePlace));
    layoutSheet(state);
  }
  function openPeople(only) {
    for (const m of mates.values()) m.marker && m.marker.getElement().classList.remove("sel");
    showCard(`
      <div class="p-head">
        <span class="num" aria-hidden="true">${svgPeople(20)}</span>
        <div><h2 class="p-title">Retreat group</h2><p class="p-meta"><span id="gRelay" class="relay"></span><span class="dot">·</span><span id="gCount">${countText()}</span></p></div>
        <button class="close" type="button" data-close aria-label="Close">${ICON.close}</button>
      </div>
      <div class="g-me" id="gMe"></div>
      <div class="g-head2"><h3>Colleagues</h3><button type="button" id="gInvite">Invite someone</button></div>
      <div class="g-filter" id="gFilterWrap" hidden><input type="search" id="gFilter" placeholder="Find a colleague" autocomplete="off" aria-label="Find a colleague" value="${esc(filter)}"></div>
      <ul class="mates" id="gList"></ul>
      <details class="g-how"><summary>How sharing works</summary>
        <p>Your phone encrypts your name and position with a key that's part of this link, then sends them through two free public relays (EMQX and HiveMQ). The relays can see that a phone connected and when, but not who you are or where. Anyone who has this link can see you while you share. Sharing pauses when your screen locks or you leave this page, and stops for good at the time you chose or when you tap Stop.</p>
      </details>`);
    renderMe(); renderRows(only); relayUI();
    $("#gInvite").addEventListener("click", invite);
    const f = $("#gFilter");
    f.addEventListener("input", () => { filter = f.value; renderRows(); });
    f.addEventListener("focus", () => { if (!isWide()) layoutSheet("placefull"); });
  }
  function renderMe() {
    const box = $("#gMe"); if (!box) return;
    box.dataset.state = sharing ? "on" : "off";
    if (sharing) {
      box.innerHTML = `<div class="g-live"><span class="pulse" aria-hidden="true"></span>
        <div class="txt"><b>Sharing as ${esc(me.name)}</b><span id="gMeSub"></span></div>
        <button class="btn stop" type="button" id="gStop">Stop</button></div>`;
      $("#gStop").addEventListener("click", () => stop(false));
      patchMe();
    } else {
      box.innerHTML = `
        <div class="g-field"><label for="gName">Your name on the map</label>
          <input type="text" id="gName" maxlength="20" autocomplete="given-name" enterkeyhint="done" placeholder="First name or nickname" value="${esc(me.name)}"${errMsg && !me.name ? ' aria-invalid="true" aria-describedby="gErr"' : ""}></div>
        <div class="g-field"><label id="gDurL">Share for</label>
          <div class="seg" role="group" aria-labelledby="gDurL">${[2, 4, 8].map((h) => `<button type="button" data-h="${h}" aria-pressed="${me.hours === h}">${h} hours</button>`).join("")}</div></div>
        ${errMsg ? `<p class="g-err" id="gErr" role="alert">${esc(errMsg)}</p>` : ""}
        <button class="btn primary" type="button" id="gStart">${svgPeople(20)}<span>Share my location</span></button>
        <p class="g-fine">Anyone with this link will see your name and where you are until the time you choose. Sharing pauses when your screen locks or you leave this page; your last spot stays visible, greyed out, for up to 20 minutes.</p>`;
      box.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => { me.hours = +b.dataset.h; save(); box.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", x === b)); }));
      const inp = $("#gName");
      inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); start(); } });
      inp.addEventListener("input", () => { if (inp.getAttribute("aria-invalid")) { inp.removeAttribute("aria-invalid"); } });
      inp.addEventListener("focus", () => { if (!isWide()) layoutSheet("placefull"); });
      $("#gStart").addEventListener("click", start);
    }
  }
  function patchMe() {
    const s = $("#gMeSub"); if (!s) return;
    s.textContent = you ? `Until ${clock(me.until)} · while this page is open` : (fixMsg || "Finding your location…");
  }
  function rowHTML(m) {
    const stale = isStale(m);
    const dist = you ? metres([you.lat, you.lng], [m.lat, m.lng]) * 1.3 / 1609.34 : null;
    const sub = m.paused ? `Phone locked · last seen ${clock(m.ts)}` : `${stale ? "Last seen" : "Seen"} ${ago(m.ts)}`;
    return `<button class="mrow${stale ? " stale" : ""}" type="button" data-id="${m.id}">
        <span class="av" style="background:${colorOf(m.id)}">${esc(initials(m.name))}</span>
        <span><span class="nm">${esc(m.name)}</span><span class="sb">${sub}${m.onMap ? "" : " · off the map"}</span></span>
        <span class="dt">${dist !== null ? (dist < 2.2 ? walkMin(dist) + " min" : nb(fmtMi(dist))) : ""}</span></button>`;
  }
  let onlyIds = null;
  function renderRows(only) {
    const ul = $("#gList"); if (!ul) return;
    if (only !== undefined) onlyIds = only || null;
    const all = [...mates.values()];
    $("#gFilterWrap").hidden = all.length < 8;
    const needle = filter.trim().toLowerCase();
    let rows = all.filter((m) => (!onlyIds || onlyIds.includes(m.id)) && (!needle || m.name.toLowerCase().includes(needle)));
    rows.sort((a, b) => isStale(a) - isStale(b) || (you ? metres([you.lat, you.lng], [a.lat, a.lng]) - metres([you.lat, you.lng], [b.lat, b.lng]) : a.name.localeCompare(b.name)));
    // patch in place: reuse rows by id so a tap never lands on a replaced element
    const existing = new Map([...ul.querySelectorAll("li[data-id]")].map((li) => [li.dataset.id, li]));
    ul.querySelectorAll("li:not([data-id])").forEach((li) => li.remove());
    const frag = document.createDocumentFragment();
    for (const m of rows) {
      let li = existing.get(m.id);
      const html = rowHTML(m);
      if (!li) { li = document.createElement("li"); li.dataset.id = m.id; li.addEventListener("click", (e) => { if (e.target.closest(".mrow")) openMate(m.id); }); }
      if (li.dataset.html !== html) { li.innerHTML = html; li.dataset.html = html; }
      existing.delete(m.id); frag.appendChild(li);
    }
    existing.forEach((li) => li.remove());
    ul.appendChild(frag);
    if (!rows.length) {
      const li = document.createElement("li"); li.className = "g-empty";
      li.textContent = needle ? `No one called “${filter}” is sharing.` : onlyIds ? "These colleagues have stopped sharing." : "No one else is sharing yet. Send the link to colleagues with “Invite someone”.";
      ul.appendChild(li);
    }
    if (onlyIds) {
      const li = document.createElement("li"); li.className = "g-empty";
      li.innerHTML = `<button type="button" class="linkish" id="gShowAll">Show everyone</button>`; ul.appendChild(li);
      li.querySelector("button").addEventListener("click", () => renderRows(null));
    }
    if (!isWide() && sheetState === "place" && !["gName", "gFilter"].includes(document.activeElement?.id)) layoutSheet("place", true);
  }
  function openMate(id) {
    const m = mates.get(id); if (!m) return;
    for (const x of mates.values()) x.marker && x.marker.getElement().classList.toggle("sel", x.id === id);
    showCard(`<div id="mateCard" data-id="${m.id}">
      <button class="back" type="button" id="gBack">${ICON_BACK}Everyone</button>
      <div class="p-head">
        <span class="num" aria-hidden="true" style="background:${colorOf(m.id)}">${esc(initials(m.name))}</span>
        <div><h2 class="p-title">${esc(m.name)}</h2><p class="p-meta" id="mMeta"></p></div>
        <button class="close" type="button" data-close aria-label="Close">${ICON.close}</button>
      </div>
      <div class="actions"><a class="btn primary" id="mGo" target="_blank" rel="noopener"></a></div>
      <p class="note" id="mNote"></p></div>`);
    patchMate();
    $("#gBack").addEventListener("click", () => openPeople());
    declutter();
    if (m.marker) centreOn(m.marker.getLatLng(), Math.max(map.getZoom(), -0.3));
  }
  function patchMate() {
    const card = $("#mateCard"); if (!card) return;
    const m = mates.get(card.dataset.id); if (!m) return;
    const dist = you ? metres([you.lat, you.lng], [m.lat, m.lng]) * 1.3 / 1609.34 : null;
    const walk = dist === null || dist < 2.2;
    $("#mMeta").innerHTML = (m.paused ? `Phone locked · last seen ${clock(m.ts)}` : `${isStale(m) ? "Last seen" : "Seen"} ${ago(m.ts)}`) + (dist !== null ? `<span class="dot">·</span>${nb(fmtMi(dist))} away` : "");
    const go = $("#mGo");
    go.href = directionsUrl({ lat: m.lat, lng: m.lng, name: m.name }, walk ? "walk" : "drive");
    go.innerHTML = `${walk ? ICON.walk : ICON.car}<span>${walk ? "Walk" : "Drive"} to ${esc(m.name)}</span>${dist !== null ? `<span class="sub">· ${walk ? walkMin(dist) : driveMin(dist)} min</span>` : ""}`;
    $("#mNote").textContent = `${m.onMap ? "" : "Outside the area of the resort map. "}Position from their phone, accurate to about ${Math.max(5, Math.round(m.acc / 5) * 5)} m.` + (m.paused ? " Their screen is locked, so they may have moved." : isStale(m) ? " They may have closed the page." : "");
  }
  async function invite() {
    const url = location.href;
    try { if (navigator.share) { await navigator.share({ title: "Kohler retreat map", text: "Find each other at the retreat:", url }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
    try { await navigator.clipboard.writeText(url); toast("Invite link copied. Anyone with it can see who's sharing, so send it only to the group."); }
    catch (_) { toast("Copy this page's address from your browser's address bar to invite someone."); }
  }

  /* ---- sharing lifecycle ---- */
  function start() {
    const name = ($("#gName")?.value || "").trim().replace(/\s+/g, " ");
    if (!name) { errMsg = "Add a first name or nickname so people know it's you."; me.name = ""; renderMe(); $("#gName").focus(); return; }
    errMsg = ""; fixMsg = ""; me.name = name.slice(0, 20); me.until = Date.now() + me.hours * 3600e3; me.pendingClear = false; save();
    sharing = true; lastSent = null;
    $("#gName")?.blur();
    begin();
    renderMe(); sharingUI(); scheduleRefresh();
    if (!isWide()) layoutSheet("place");
  }
  function begin() {
    quietLocErrors = true;
    startWatch(true);
    if (you) publish(true);
    clearInterval(hb); hb = setInterval(() => publish(true), 60e3);
    sharingUI();
  }
  function stop(auto) {
    sharing = false; me.until = 0; save(); clearInterval(hb); lastSent = null; quietLocErrors = false;
    clearMine();
    if ($("#gMe")) renderMe();
    sharingUI(); scheduleRefresh();
    toast(auto ? "Your sharing time ended. Your dot has been removed." : "You've stopped sharing. Your dot has been removed.");
  }
  posHooks.push(() => { if (sharing) { fixMsg = ""; publish(false); } if ($("#gMe") && sharing) patchMe(); });
  errHooks.push((err) => {
    if (!sharing) return;
    if (err && err.code === 1) {
      sharing = false; me.until = 0; save(); clearInterval(hb); quietLocErrors = false; sharingUI();
      errMsg = "Location access is off for this site. Turn it on in your browser settings (Safari: aA › Website Settings › Location), then try again.";
      openPeople();
    } else if (!you) { fixMsg = "Can't get a GPS fix yet. Step outside, or check Location is on for your browser."; patchMe(); }
  });
  closeHooks.push(() => { for (const m of mates.values()) m.marker && m.marker.getElement().classList.remove("sel"); onlyIds = null; declutter(); });
  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { if (sharing) publish(true, true); }
    else { sweep(); if (sharing) { publish(true); toast("Welcome back. Sharing resumed."); } }
  });
  chip.addEventListener("click", (e) => { if (chip.dataset.kind === "share") { e.stopImmediatePropagation(); openPeople(); } }, true);

  /* ---- boot ---- */
  $("#btnPeople").hidden = false;
  $("#btnPeople").addEventListener("click", () => ($("#gList") ? closePlace() : openPeople()));
  setInterval(sweep, 30e3);
  init().then(() => {
    const go = () => { mqttLoaded = true; connect(); relayUI(); };
    if (window.mqtt) go();
    else { const s = document.createElement("script"); s.src = MQTT_SRC; s.onload = go; s.onerror = () => toast("Couldn't load live sharing. Check your connection and reload."); document.head.appendChild(s); }
    if (me.until > Date.now() && me.name) { sharing = true; begin(); }
    else if (me.until) { me.until = 0; save(); }
    if (!me.welcomed || sharing) { me.welcomed = true; save(); setTimeout(() => openPeople(), 300); }
  });
  return { openPeople, openMate, mates, me, clients, start, stop, isSharing: () => sharing, _upsert: upsert };
})();


/* ---------- boot ---------- */
renderList();
layoutSheet("peek", false);
map.invalidateSize();
fitArea(CORE, { instant: true });
recluster();
const deep = /^#p(\d{1,2})$/.exec(location.hash);
if (deep && BY_N[+deep[1]]) setTimeout(() => openPlace(+deep[1], { from: "list" }), 50);
let rt;
addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { map.invalidateSize(); layoutSheet(sheetState, false); recluster(); }, 120); });
window.__kohler = { openPlace, closePlace, map, layoutSheet, updateYou, locError, geoToPx, group: typeof GROUP !== "undefined" ? GROUP : null };
})();
</script>
</body></html>
